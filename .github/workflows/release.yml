name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - run: npm run tauri build -- --bundles nsis
      - name: Prepare installer and checksum
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          Copy-Item $installer[0].FullName Velo-Setup.exe
          $hash = (Get-FileHash Velo-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Velo-Setup.exe" | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: velo-windows
          path: |
            Velo-Setup.exe
            SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            Velo-Setup.exe
            SHA256SUMS.txt
