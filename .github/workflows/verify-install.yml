name: Verify Windows installer
on: workflow_dispatch
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    steps:
      - name: Download and verify published installer
        shell: pwsh
        run: |
          $base = 'https://github.com/farhanfath/velo/releases/latest/download'
          Invoke-WebRequest "$base/Velo-Setup.exe" -OutFile Velo-Setup.exe
          Invoke-WebRequest "$base/SHA256SUMS.txt" -OutFile SHA256SUMS.txt
          $expected = ((Get-Content SHA256SUMS.txt -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash Velo-Setup.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Installer checksum mismatch' }
      - name: Install and uninstall on clean Windows
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'VeloSmokeTest'
          $setup = Start-Process ./Velo-Setup.exe -ArgumentList '/S', "/D=$target" -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited $($setup.ExitCode)" }
          $binary = Join-Path $target 'Velo.exe'
          if (!(Test-Path -LiteralPath $binary)) { throw 'Installed Velo.exe missing' }
          $version = (Get-Item -LiteralPath $binary).VersionInfo.ProductVersion
          Write-Output "Installed Velo $version successfully"
          $uninstaller = Join-Path $target 'uninstall.exe'
          if (!(Test-Path -LiteralPath $uninstaller)) { throw 'Uninstaller missing' }
          $remove = Start-Process $uninstaller -ArgumentList '/S', "_?=$target" -WindowStyle Hidden -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstaller exited $($remove.ExitCode)" }
          if (Test-Path -LiteralPath $binary) { throw 'Uninstall left Velo.exe behind' }
